<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/logo/logo.png" />
    <link rel="stylesheet" href="../assets/style.css" />
    <title>MoviesNook — Sign up</title>
  </head>
  <body>
    <header class="nav">
      <a class="logo" href="../index.html"><span class="mark">M</span><span>MOVIES<span class="nook">NOOK</span></span></a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="login.html">Login</a>
      </nav>
    </header>

    <div class="auth-wrap">
      <div class="auth-art">
        <img src="../assets/posters/thor-ragnarok.jpg" alt="" />
        <p class="quote">Create your account and <span>start watching tonight.</span></p>
      </div>
      <form class="auth-card" id="form" novalidate>
        <h1>Create account</h1>
        <p class="sub">It takes less than a minute.</p>
        <div class="two">
          <div class="field"><label for="fn">First name</label><input id="fn" type="text" placeholder="First name" required /></div>
          <div class="field"><label for="ln">Last name</label><input id="ln" type="text" placeholder="Last name" required /></div>
        </div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" required /></div>
        <div class="two">
          <div class="field"><label for="pw">Password</label><input id="pw" type="password" placeholder="Min. 6 characters" minlength="6" required /></div>
          <div class="field"><label for="pw2">Confirm password</label><input id="pw2" type="password" placeholder="Repeat password" required /></div>
        </div>
        <div class="field">
          <label>Gender</label>
          <div class="radio-row">
            <label><input type="radio" name="g1" value="male" required /> Male</label>
            <label><input type="radio" name="g1" value="female" /> Female</label>
          </div>
        </div>
        <div class="field"><label for="bd">Birth date</label><input id="bd" type="date" required /></div>
        <div class="two">
          <button class="btn block" type="submit">Sign up</button>
          <button class="btn ghost block" type="reset">Reset</button>
        </div>
        <div class="msg" id="msg"></div>
        <p class="foot">Already have an account? <a href="login.html">Log in</a></p>
      </form>
    </div>

    <script>
      // Front-end only demo: client-side validation, no backend.
      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const f = e.target, msg = document.getElementById("msg");
        let err = "";
        if (!f.checkValidity()) err = "Please fill in all fields correctly.";
        else if (f.pw.value !== f.pw2.value) err = "Passwords do not match.";
        msg.className = "msg show" + (err ? " err" : "");
        msg.textContent = err || "Account created (demo) — welcome to MoviesNook!";
        if (!err) setTimeout(() => (location.href = "login.html"), 1100);
      });
    </script>
  </body>
</html>
