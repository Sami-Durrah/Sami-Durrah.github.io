<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/logo/logo.png" />
    <link rel="stylesheet" href="../assets/style.css" />
    <title>MoviesNook — Login</title>
  </head>
  <body>
    <header class="nav">
      <a class="logo" href="../index.html"><span class="mark">M</span><span>MOVIES<span class="nook">NOOK</span></span></a>
      <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a class="cta" href="signup.html">Sign up</a>
      </nav>
    </header>

    <div class="auth-wrap">
      <div class="auth-art">
        <img src="../assets/posters/john-wick.jpg" alt="" />
        <p class="quote">Thousands of stories. <span>One nook.</span></p>
      </div>
      <form class="auth-card" id="form" novalidate>
        <h1>Welcome back</h1>
        <p class="sub">Log in to continue watching.</p>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" minlength="6" required />
        </div>
        <button class="btn block" type="submit">Log in</button>
        <div class="msg" id="msg"></div>
        <p class="foot">New here? <a href="signup.html">Create an account</a></p>
      </form>
    </div>

    <script>
      // Front-end only demo: validates the form, there is no real backend.
      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const msg = document.getElementById("msg");
        const ok = e.target.checkValidity();
        msg.className = "msg show" + (ok ? "" : " err");
        msg.textContent = ok ? "Logged in (demo) — redirecting…" : "Please enter a valid email and a password of at least 6 characters.";
        if (ok) setTimeout(() => (location.href = "movies.html"), 900);
      });
    </script>
  </body>
</html>
